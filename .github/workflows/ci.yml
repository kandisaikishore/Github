name: Repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate available project
        shell: bash
        run: |
          set -euo pipefail
          echo "Top-level files:"
          find . -maxdepth 2 -type f -not -path './.git/*' -print | sort
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm test --if-present
            npm run build --if-present
          elif [ -f pom.xml ]; then
            mvn -B test
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            if [ -x ./gradlew ]; then ./gradlew test; else echo "Gradle wrapper missing"; exit 1; fi
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
            python -m compileall -q .
          else
            echo "No recognized build manifest; repository inventory check passed."
          fi
